name: Checa fontes do TSE

# REPOSITÓRIO CONGELADO (eleição de 2026 encerrada): o cron foi DESLIGADO em 21/11/2026.
# Antes rodava todo dia e, na semana da eleição, de hora em hora, atualizando só o bloco de
# status do live.json. O disparo manual continua disponível.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checa fontes e atualiza status
        run: python tools/checa_fontes.py docs/dados/live.json
      - name: Publica
        run: |
          git config user.name "checa-fontes[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/live.json
          git diff --cached --quiet || git commit -m "Status das fontes do TSE [skip ci]"
          git push
