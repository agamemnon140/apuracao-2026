name: Checa fontes do TSE

# Mantém a aba "Dados e fontes" honesta todo dia e, na semana da eleição, de hora em hora
# (para ver quando a eleição de 2026 entra no índice do TSE). Só atualiza o bloco de status
# do live.json. NAS NOITES DE APURAÇÃO o workflow fica quieto: o runner local
# (runner/ciclo.py) é o único a escrever live.json e checa as fontes ele mesmo -- dois
# escritores no mesmo arquivo rejeitariam os pushes um do outro.
on:
  schedule:
    - cron: "0 12 * * *"            # diário, 09:00 BRT
    - cron: "0 * 1-3 10 *"          # 01-03/10: de hora em hora
    - cron: "0 10-18 4 10 *"        # 04/10: 07h-15h BRT, antes do runner assumir
    - cron: "0 * 22-24 10 *"        # 22-24/10: de hora em hora
    - cron: "0 10-18 25 10 *"       # 25/10: 07h-15h BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checa fontes e atualiza status
        run: python tools/checa_fontes.py docs/dados/live.json
      - name: Publica
        run: |
          git config user.name "checa-fontes[bot]"
          git config user.email "hrqnoronha@gmail.com"
          git add docs/dados/live.json
          git diff --cached --quiet || git commit -m "Status das fontes do TSE [skip ci]"
          git push
